name: real checkers in isolation (lab)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  judge:
    # 비밀값 없음. 운영 저장소는 자료로만 받는다(체크아웃하지 않고 blob 만 꺼낸다).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the operating repo as bare git data (two commits, no checkout)
        run: |
          git init -q --bare src.git
          git --git-dir src.git fetch -q --depth 1 https://github.com/fdo2a/fdo2a.github.io 3378e19652bbd5fdfef8281d4b33ad7fe18a4cb5 e9ef1a8394b4ae95dd9a7e663f22ac38b68096ff
      - name: No credentials in this job
        run: |
          if env | grep -i -E 'DEPLOY|SSH_KEY|SITE_' ; then exit 1; fi; echo "no deploy credential in env"
      - name: Run the real US gates from the pinned copy against extracted data with hostile modules planted
        run: python3 real_check.py "$PWD/src.git" 3378e19652bbd5fdfef8281d4b33ad7fe18a4cb5 2026-11-16 us-2026-11-16-daily-cycle "$RUNNER_TEMP/work"
